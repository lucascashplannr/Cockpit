name: Release

# Tags only. A push to main builds nothing: a release is a deliberate act, and
# `v0.2.0` is how it is spelled.
on:
  push:
    tags: ['v*']
  # Kept for dry runs — builds the installers and uploads them as workflow
  # artifacts without touching a release.
  workflow_dispatch:

# Needed by electron-builder to create the release and upload to it.
permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing must not bin the other's artifacts: a broken
      # Windows build should still leave a working macOS one to download.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Native modules are rebuilt against Electron's ABI, not this Node's —
      # electron-builder does it during packaging. This Node only has to be new
      # enough to run the toolchain.
      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match apps/desktop/package.json ($pkg)."
            echo "The updater compares versions, so a release built under the wrong"
            echo "number is a release nobody is offered. Bump the package first."
            exit 1
          fi

      - name: Build and publish
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Carried under their own names, not electron-builder's. A secret that
          # does not exist expands to the empty string rather than to nothing at
          # all, and electron-builder reads an empty CSC_LINK as a certificate
          # path it then resolves against the project directory — which is a
          # directory, so it fails with "not a file" and no mention of signing.
          # Its variables are exported below only when there is something to put
          # in them.
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # The steps of `pnpm dist`, spelled out rather than run through it:
          # appending flags to a `&&` chain relies on where the package manager
          # decides to put them, and this one has to land on electron-builder.
          pnpm run build
          pnpm run bundle:core

          args=""
          if [ -n "$MAC_CERT_P12_BASE64" ]; then
            export CSC_LINK="$MAC_CERT_P12_BASE64"
            export CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            # Notarization is asked for only when there is both a certificate to
            # sign with and an account to notarise through; requesting it without
            # either fails the build rather than degrading to an unsigned build.
            if [ -n "$MAC_APPLE_ID" ]; then
              export APPLE_ID="$MAC_APPLE_ID"
              export APPLE_APP_SPECIFIC_PASSWORD="$MAC_APPLE_APP_PASSWORD"
              export APPLE_TEAM_ID="$MAC_APPLE_TEAM_ID"
              args="--config.mac.notarize=true"
            fi
          fi

          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            pnpm exec electron-builder --publish always $args
          else
            pnpm exec electron-builder --publish never $args
          fi

      # Dry runs keep their output somewhere reachable; tagged runs already have
      # it on the release.
      - name: Upload installers
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-${{ matrix.name }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.yml
          if-no-files-found: warn
